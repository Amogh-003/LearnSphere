{% extends 'base.html' %}
{% block content %}
<div class="form-page">
  <h2>Set a new password</h2>
  {% if validlink %}
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Change password</button>
    </form>
  {% else %}
    <p>This password reset link is invalid, possibly because it has already been used.</p>
  {% endif %}
</div>
{% endblock %}
